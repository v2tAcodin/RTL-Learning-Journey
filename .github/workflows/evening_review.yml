name: RTL Evening Code Review

on:
  workflow_dispatch:
  schedule:
  - cron: "47 14 * * *"  # 14:47 UTC = 21:47 giờ VN

permissions:
  contents: write

jobs:

  review:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần full git history để git diff hoạt động đúng

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt

      - name: Run evening code review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/run_evening_review.py

      - name: Commit updated progress.json
        run: |
          git config user.name "rtl-mentor-bot"
          git config user.email "actions@github.com"
          git add progress.json
          git diff --cached --quiet || git commit -m "chore: update progress after evening review [skip ci]"
          git push