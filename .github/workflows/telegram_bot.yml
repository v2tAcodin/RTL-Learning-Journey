name: RTL Morning Mentor

on:
  workflow_dispatch:
  schedule:
    - cron: "13 0 * * 0,2"  # 07:13 giờ Việt Nam (UTC+7), chỉ Chủ nhật (0) và Thứ 3 (2)

permissions:
  contents: write

jobs:

  mentor:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt

      - name: Run mentor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/main.py

      - name: Commit updated progress.json
        run: |
          git config user.name "rtl-mentor-bot"
          git config user.email "actions@github.com"
          git add progress.json
          git diff --cached --quiet || git commit -m "chore: update progress after morning run [skip ci]"
          git push